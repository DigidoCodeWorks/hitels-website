name: Cloudflare Pages Preview

# Deploys every same-repo PR to its own Cloudflare Pages preview URL, built
# the same way as the production build in deploy-cloudflare.yml but pushed
# under the PR's branch name instead of main — gives reviewers a live link
# without touching production. Fork PRs are skipped since they can't access
# repo secrets (Sanity token, Cloudflare API token) and the build/deploy
# would just fail.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - run: npm ci

      # No PUBLIC_SITE_URL here on purpose: falling back to astro.config.mjs's
      # pages.dev placeholder keeps canonical/OG tags from pointing at the
      # production domain from a preview build.
      - run: npm run build
        env:
          PUBLIC_SANITY_PROJECT_ID: ${{ secrets.PUBLIC_SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: ${{ secrets.PUBLIC_SANITY_DATASET }}
          PUBLIC_CONTACT_FORM_ENDPOINT: ${{ secrets.PUBLIC_CONTACT_FORM_ENDPOINT }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          PUBLIC_CF_BEACON_TOKEN: ${{ secrets.PUBLIC_CF_BEACON_TOKEN }}

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        run: |
          npx wrangler pages deploy dist \
            --project-name simple-website \
            --branch "${{ github.head_ref }}" \
            --commit-dirty=true | tee /tmp/wrangler-deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' /tmp/wrangler-deploy.log | tail -1)
          if [ -z "$url" ]; then
            echo "Could not find a deployment URL in wrangler's output" >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- cloudflare-preview-comment -->';
            const url = process.env.PREVIEW_URL;
            const body = `${marker}\n🔗 **Preview deployed:** ${url}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
